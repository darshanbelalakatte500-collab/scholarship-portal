<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration - Vidya Chetana</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Vidya Chetana</h1>
    <p>Student Registration</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="scholarship.html">Scholarship</a>
    <a href="eligibility.html">Eligibility</a>
    <a href="register.html">Register</a>
    <a href="login.html">Login</a>
</nav>

<section class="form-section">

    <h2>Student Registration</h2>

    <form id="registrationForm">

        <label>Student Name</label>
        <input type="text" id="name" required>

        <label>Date of Birth</label>
        <input type="date" id="dob" required>

        <label>Mobile Number</label>
        <input type="tel" id="mobile"
               pattern="[0-9]{10}"
               maxlength="10"
               required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Gender</label>
        <select id="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Category</label>
        <select id="category" required>
            <option value="">Select Category</option>
            <option>General</option>
            <option>OBC</option>
            <option>SC</option>
            <option>ST</option>
            <option>Other</option>
        </select>

        <label>10th Marks (%)</label>
        <input type="number" id="tenth"
               min="0" max="100" step="0.01" required>

        <label>12th / Diploma Marks (%)</label>
        <input type="number" id="twelfth"
               min="0" max="100" step="0.01" required>

        <label>College Name</label>
        <input type="text" id="college" required>

        <label>Course</label>
        <input type="text" id="course"
               placeholder="Example: B.E Computer Science"
               required>

        <label>Current Semester</label>
        <select id="semester" required>
            <option value="">Select Semester</option>
            <option>1st Semester</option>
            <option>2nd Semester</option>
            <option>3rd Semester</option>
            <option>4th Semester</option>
            <option>5th Semester</option>
            <option>6th Semester</option>
            <option>7th Semester</option>
            <option>8th Semester</option>
        </select>

        <label>Annual Family Income</label>
        <input type="number" id="income" required>

        <label>Create Password</label>
        <input type="password" id="password"
               minlength="6" required>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword"
               minlength="6" required>

        <button type="submit" class="button">
            Register
        </button>

    </form>

    <p id="message"></p>

</section>

<footer>
    <p>© 2026 Vidya Chetana Scholarship Portal</p>
</footer>

<script src="script.js"></script>

</body>
</html>
